<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cos Nostra</title>
    <script type="module" src="/src/main.ts" defer></script>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; font-size: 14px; }
      html, body { height: 100%; }
      body { margin: 0; padding: 12px 16px; box-sizing: border-box; overflow-y: auto; }
      h1 { font-size: 16px; margin: 0; }
      header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
      nav button { background: none; border: none; padding: 4px 8px; font: inherit; cursor: pointer; opacity: 0.6; border-bottom: 2px solid transparent; }
      nav button[aria-selected="true"] { opacity: 1; border-bottom-color: currentColor; }
      section[hidden] { display: none; }
      .row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px solid #8884; }
      .row span:last-child { font-family: ui-monospace, monospace; text-align: right; overflow-wrap: anywhere; }
      .banner { padding: 6px 8px; border-radius: 4px; font-size: 13px; margin: 8px 0; white-space: pre-wrap; }
      .banner:empty { display: none; }
      .warn { background: #e9a00033; border: 1px solid #e9a000; }
      .err { background: #d3333322; border: 1px solid #d33; }
      .ok { background: #22aa2222; border: 1px solid #2a2; }
      .actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
      button { padding: 6px 12px; font: inherit; }
      #last { font-size: 12px; margin-top: 8px; opacity: 0.8; overflow-wrap: anywhere; }
      form { display: grid; grid-template-columns: max-content 1fr; gap: 8px 12px; align-items: center; }
      form label { white-space: nowrap; }
      form .full { grid-column: 1 / -1; }
      form input[type="number"], form input[type="text"] { width: 100%; box-sizing: border-box; padding: 4px 6px; font: inherit; }
      .inline { display: flex; gap: 6px; align-items: center; }
      .inline input[type="text"] { flex: 1; }
      .check { display: flex; align-items: center; gap: 6px; }
      #hotkey_display { font-family: ui-monospace, monospace; min-width: 90px; }
      .hint { font-size: 12px; opacity: 0.7; }
      /* Clips list. Compact: the window is 480x360. */
      #clips { display: flex; flex-direction: column; gap: 6px; }
      .clip { display: grid; grid-template-columns: 96px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid #8884; align-items: start; }
      .clip .thumb { width: 96px; height: 54px; background: #8882; object-fit: cover; border-radius: 3px; display: block; }
      .clip .meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: 12px; }
      .clip .top { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
      .clip .game { font-size: 13px; font-weight: 600; cursor: text; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .clip .game:empty::before { content: "Unknown game"; opacity: 0.5; font-weight: normal; }
      .clip .game-edit { font: inherit; font-size: 13px; padding: 1px 4px; width: 100%; box-sizing: border-box; }
      .clip .detail { opacity: 0.75; font-family: ui-monospace, monospace; font-size: 11px; overflow-wrap: anywhere; }
      .clip .buttons { display: flex; gap: 4px; margin-top: 2px; }
      .clip .buttons button { padding: 2px 7px; font-size: 11px; }
      .badge { font-size: 11px; padding: 1px 6px; border-radius: 8px; border: 1px solid #8886; white-space: nowrap; flex-shrink: 0; }
      .badge.saved { border-color: #8888; }
      .badge.encoding { border-color: #e9a000; background: #e9a00033; }
      .badge.encoded, .badge.done { border-color: #2a2; background: #22aa2222; }
      .badge.uploading { border-color: #38f; background: #3388ff22; }
      .badge.failed { border-color: #d33; background: #d3333322; cursor: help; }
      #clips_empty { opacity: 0.6; padding: 12px 0; }
      .clip .link { font-family: ui-monospace, monospace; font-size: 11px; opacity: 0.75; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* Account block in Settings. */
      fieldset { grid-column: 1 / -1; border: 1px solid #8884; border-radius: 4px; padding: 8px 10px; margin: 4px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 12px; align-items: center; }
      legend { font-size: 12px; opacity: 0.7; padding: 0 4px; }
      #login_code { font-family: ui-monospace, monospace; font-size: 18px; letter-spacing: 2px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Cos Nostra clipper</h1>
      <nav role="tablist">
        <button id="tab-status" role="tab" aria-selected="true">Status</button>
        <button id="tab-clips" role="tab" aria-selected="false">Clips</button>
        <button id="tab-settings" role="tab" aria-selected="false">Settings</button>
      </nav>
    </header>

    <section id="panel-status">
      <div class="row"><span>Buffer</span><span id="recording">starting…</span></div>
      <div class="row"><span>Capture</span><span id="game">–</span></div>
      <div class="row"><span>Encoder</span><span id="encoder">–</span></div>
      <div class="row"><span>Encoders</span><span id="encoders">–</span></div>
      <div class="row"><span>Hotkey</span><span id="hotkey">–</span></div>
      <div class="row"><span>Length</span><span id="seconds">–</span></div>
      <div class="row"><span>Folder</span><span id="dir">–</span></div>
      <div class="row"><span>Account</span><span id="account">–</span></div>
      <div id="conflict" class="banner warn"></div>
      <div id="error" class="banner err"></div>
      <div class="actions">
        <button id="save">Save clip now</button>
        <button id="retry" hidden>Retry</button>
      </div>
      <div id="last"></div>
    </section>

    <section id="panel-clips" hidden>
      <div id="clips_error" class="banner err"></div>
      <div id="clips"></div>
      <div id="clips_empty" hidden>No clips yet. Press the hotkey while playing.</div>
    </section>

    <section id="panel-settings" hidden>
      <form id="settings-form">
        <label for="hotkey_display">Hotkey</label>
        <div class="inline">
          <span id="hotkey_display">–</span>
          <button type="button" id="hotkey_bind">Press keys</button>
        </div>

        <label for="buffer_seconds">Buffer length</label>
        <div class="inline"><input type="number" id="buffer_seconds" min="5" max="300" step="1" /><span class="hint">s</span></div>

        <label for="video_bitrate_kbps">Video bitrate</label>
        <div class="inline"><input type="number" id="video_bitrate_kbps" min="2000" max="60000" step="500" /><span class="hint">kbps</span></div>

        <label for="clip_dir">Clip folder</label>
        <div class="inline">
          <input type="text" id="clip_dir" readonly />
          <button type="button" id="pick_dir">Browse…</button>
        </div>

        <div class="full check"><input type="checkbox" id="start_with_windows" /><label for="start_with_windows">Start with Windows</label></div>
        <div class="full check"><input type="checkbox" id="notify_on_save" /><label for="notify_on_save">Show a notification when a clip is saved</label></div>
        <div class="full check"><input type="checkbox" id="sound_on_save" /><label for="sound_on_save">Play a sound when a clip is saved</label></div>
        <div class="full check"><input type="checkbox" id="encode_while_gaming" /><label for="encode_while_gaming">Encode while a game is running</label></div>

        <label for="quality">Clip quality</label>
        <div class="inline">
          <select id="quality">
            <option value="small">Smaller files</option>
            <option value="balanced">Balanced</option>
            <option value="high">Best quality</option>
          </select>
          <span class="hint" id="quality_hint"></span>
        </div>

        <label for="encode_engine">Encode with</label>
        <div class="inline">
          <select id="encode_engine">
            <option value="cpu">Processor (smaller files, slower)</option>
            <option value="gpu">Graphics card (faster)</option>
          </select>
          <span class="hint" id="encode_engine_hint"></span>
        </div>

        <fieldset>
          <legend>Account</legend>
          <div class="full" id="account_logged_out">
            <div class="inline">
              <button type="button" id="login">Link Discord</button>
              <span class="hint">Opens your browser to log in with Discord.</span>
            </div>
          </div>
          <div class="full" id="account_pending" hidden>
            <div class="inline">
              <span id="login_code">–</span>
              <span class="hint">waiting for the browser…</span>
              <button type="button" id="login_cancel">Cancel</button>
            </div>
          </div>
          <div class="full" id="account_logged_in" hidden>
            <div class="inline">
              <span id="account_name">–</span>
              <button type="button" id="logout">Log out</button>
            </div>
          </div>
          <div class="full hint" id="login_msg"></div>

          <label for="backend_url">Backend URL</label>
          <input type="text" id="backend_url" spellcheck="false" />
          <div class="full check"><input type="checkbox" id="auto_upload" /><label for="auto_upload">Upload clips automatically</label></div>
        </fieldset>

        <div class="full actions">
          <button type="submit" id="settings_save">Save settings</button>
          <span id="settings_msg" class="hint"></span>
        </div>
      </form>
    </section>
  </body>
</html>
