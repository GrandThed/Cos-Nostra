<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cos Nostra</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <!-- The window is undecorated, so this is the title bar. Anything not a button drags it. -->
    <div class="titlebar" data-tauri-drag-region>
      <span class="mark" aria-hidden="true"></span>
      <span class="wordmark" data-tauri-drag-region>Cos Nostra</span>
      <span class="grow" data-tauri-drag-region></span>
      <div class="window-buttons">
        <button type="button" id="win-minimize" title="Minimise">&#8211;</button>
        <button type="button" id="win-maximize" title="Maximise">&#9634;</button>
        <button type="button" id="win-close" class="close" title="Close to the tray">&#10005;</button>
      </div>
    </div>

    <header class="toolbar">
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button type="button" role="tab" id="tab-library" aria-selected="true">Library</button>
        <button type="button" role="tab" id="tab-matches" aria-selected="false">Matches</button>
        <button type="button" role="tab" id="tab-storage" aria-selected="false">Storage</button>
        <button type="button" role="tab" id="tab-settings" aria-selected="false">Settings</button>
      </nav>
      <span class="grow"></span>
      <button type="button" class="status-pill" id="status-pill" aria-expanded="false" aria-controls="status-panel">
        <span class="dot" id="status-dot"></span>
        <span class="status-label" id="status-label">Starting…</span>
        <span class="status-game mono" id="status-game"></span>
      </button>
      <button type="button" class="btn primary save-clip" id="save-clip">
        Save clip <span class="key mono" id="save-hotkey"></span>
      </button>
      <span class="avatar" id="account-avatar" hidden></span>
    </header>

    <div class="banners" id="banners"></div>
    <main class="view" id="view"></main>

    <div class="popover" id="status-panel" hidden></div>
    <div class="first-run" id="first-run" hidden></div>
  </body>
</html>
