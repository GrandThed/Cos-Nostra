// CS2 / CS:GO Game State Integration config for Cos Nostra.
//
// This is NOT copied into the game automatically (nothing in the desktop app writes to a
// Steam library folder yet). To enable it by hand:
//
//   1. Find the game's cfg folder, typically:
//      <Steam library>\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\
//   2. Copy this file into that folder.
//   3. Restart CS2 (or run `mp_endround; exec gamestate_integration_cosnostra` in console).
//
// The port here (51122) must match `providers::counter_strike::GSI_PORT` in the desktop app.
"Cos Nostra GSI"
{
    "uri"           "http://127.0.0.1:51122/"
    "timeout"       "5.0"
    "buffer"        "0.1"
    "throttle"      "0.1"
    "heartbeat"     "30.0"
    "data"
    {
        "provider"          "1"
        "map"               "1"
        "round"             "1"
        "player_id"         "1"
        "player_state"      "1"
    }
}
