[package]
name = "cos-nostra-desktop"
version = "0.3.0"
description = "Cos Nostra game clipper"
authors = ["Cos Nostra contributors"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "cos_nostra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Clip job queue. SQLite is public domain; the crate is MIT.
rusqlite = { version = "0.40", features = ["bundled"] }
# Already pulled in by tauri-plugin-autostart; used to quote the Run entry it writes.
winreg = "0.55"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Backend API client. 0.13 with rustls is already in the graph through libobs-bootstrapper.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
chrono = "0.4"
# Decodes the base64 presence blob the Riot client serves. Already in the graph (MIT/Apache).
base64 = "0.22"
# Encodes the icon pulled out of a game's exe for the game art cache. Already in the graph (MIT/Apache).
png = "0.18"
# CS2's Game State Integration POSTs JSON to a local HTTP endpoint. Apache-2.0/MIT, no async
# runtime needed (the rest of the app is threads + blocking calls), unlike axum or warp.
tiny_http = "0.12"
# Win32 calls for the foreground window lookup, the game process watch, the save sound and the
# microphone and audio-app lists in Settings. Same version libobs-window-helper uses.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Media_Audio",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
] }

# Embedded OBS. libobs-bootstrapper downloads the signed OBS runtime on first launch.
libobs-wrapper = "9"
libobs-simple = { version = "8", features = ["window-list"] }
libobs-bootstrapper = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind so a libobs panic during startup becomes a retryable error instead of an abort.
panic = "unwind"
strip = true
