[package]
name = "cos-nostra-desktop"
version = "0.1.0"
description = "Cos Nostra game clipper"
authors = ["Cos Nostra contributors"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "cos_nostra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
chrono = "0.4"

# Embedded OBS. libobs-bootstrapper downloads the signed OBS runtime on first launch.
libobs-wrapper = "9"
libobs-simple = { version = "8", features = ["window-list"] }
libobs-bootstrapper = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
