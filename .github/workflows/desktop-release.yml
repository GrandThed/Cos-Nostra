# Builds the Windows NSIS installer for the desktop clipper on every v* tag, signs it for the
# Tauri updater with the CosNostraUpdaterKey secrets, and attaches it (plus latest.json) to a
# published GitHub release, which is what tauri-plugin-updater polls. The binary itself is still
# unsigned: code signing is deferred.
name: desktop-release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: npm ci

      # The installer ships the minimal ffmpeg from build-ffmpeg.sh, never a full build. The
      # exe is cached by the script's hash, and ci.yml builds it under the same key on main, so
      # a tag usually restores it instead of spending ~20 minutes compiling. ensure-ffmpeg (run
      # by tauri-action's beforeBuildCommand) then finds it in place.
      - name: Cache minimal ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: apps/desktop/src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          key: ffmpeg-minimal-${{ hashFiles('apps/desktop/scripts/build-ffmpeg.sh') }}

      - if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            make diffutils bzip2 xz curl
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Build minimal ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash apps/desktop/scripts/build-ffmpeg.sh "$RUNNER_TEMP/ffmpeg-build" apps/desktop/src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe

      # The release notes are the tag's section of apps/desktop/CHANGELOG.md: everything under
      # the "## vX.Y.Z" heading up to the next "## ". The checkout may have CRLF line endings,
      # hence the sub(). A tag with no section publishes with an empty body.
      - name: Release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<CHANGELOG_EOF'
            awk -v tag="## ${GITHUB_REF_NAME}" '
              { sub(/\r$/, "") }
              /^## / { on = ($0 == tag || index($0, tag " ") == 1); next }
              on
            ' apps/desktop/CHANGELOG.md
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Cos Nostra ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # Draft releases are invisible to the updater's "latest" endpoint, so this has to
          # publish straight away; there is no review step before an update goes out.
          releaseDraft: false
          args: --bundles nsis
